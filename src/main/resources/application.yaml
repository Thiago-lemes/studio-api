spring:
  application:
    name: studio-api
  datasource:
    url: jdbc:postgresql://localhost:5432/creative_studio
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
  show-actuator: false

jwt:
  secret: ${JWT_SECRET:uma-chave-secreta-de-desenvolvimento-com-32-caracteres-ou-mais}
  expiration-ms: 28800000
