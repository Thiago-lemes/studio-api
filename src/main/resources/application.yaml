spring:
  application:
    name: studio-api
  datasource:
    url: jdbc:postgresql://localhost:5432/creative_studio
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
  show-actuator: false

jwt:
  secret: ${JWT_SECRET:uma-chave-secreta-de-desenvolvimento-com-32-caracteres-ou-mais}
  expiration-ms: 28800000

cors:
  # Origens do front liberadas, separadas por vírgula. O default cobre o `ng serve`.
  # Em produção, sobrescreva com CORS_ALLOWED_ORIGINS=https://app.seudominio.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app:
  # Base do link de convite (`{frontend-url}/completar-cadastro?token=...`).
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  convite:
    validade-horas: ${APP_CONVITE_VALIDADE_HORAS:8}
